name: Check status of branch
on:
    pull_request:
    workflow_dispatch:
env:
    NODE_ENV: production
    frontendPath: ../build/frontend
jobs:
    eslint:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v3
            - uses: oven-sh/setup-bun@v2
            # Install dependencies
            - name: Installing dependencies
              run: bun install
            # Setup types
            - name: Generate prisma types
              working-directory: ./backend
              run: bun run generate
            - name: Build compiled types
              working-directory: ./shared
              run: bun run build-types
            # Run type checks
            - name: Type-check shared
              working-directory: ./shared
              run: bun run type-check
            - name: Type-check backend
              working-directory: ./backend
              run: bun run type-check
            - name: Type-check frontend
              working-directory: ./frontend
              run: bun run type-check
            # Run ESLint
            - name: Lint shared
              working-directory: ./shared
              run: bun run lint
            - name: Lint backend
              working-directory: ./backend
              run: bun run lint
            - name: Lint frontend
              working-directory: ./frontend
              run: bun run lint
            # Run StyleLint
            - name: Run Stylelint
              working-directory: ./frontend
              run: bun run stylelint
    build-and-test:
        runs-on: ubuntu-latest

        # PostgreSQL container to run with build-and-test job
        services:
          database:
            image: postgres:16-alpine
            env:
              POSTGRES_DB: bestiarybuilder
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: password
            ports:
              - 5432:5432

        steps:
            - uses: actions/checkout@master
            - uses: oven-sh/setup-bun@v2
            # Install dependencies
            - name: Installing project dependencies
              run: bun install
            # Setup prisma types and database for testing
            - name: Create .env
              working-directory: ./backend
              run: cp .env.template .env
            - name: Generate prisma types
              working-directory: ./backend
              run: bun run generate
            - name: Run prisma migrations
              working-directory: ./backend
              run: bunx prisma migrate dev
            # Build frontend and backend
            - name: Build compiled types
              working-directory: ./shared
              run: bun run build-types
            - name: Building the frontend
              working-directory: ./frontend
              run: bun run build
              env:
                  VITE_DISCORD_ID: ${{ secrets.VITE_DISCORD_ID }}
                  VITE_ERROR_WEBHOOK: ${{ secrets.VITE_ERROR_WEBHOOK }}
            - name: Building the backend
              working-directory: ./backend
              run: bun build src/server.ts --compile --outfile ../build/server
            # Run tests
            - name: Running backend tests
              working-directory: ./backend
              run: bun run test
